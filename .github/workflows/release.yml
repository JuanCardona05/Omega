name: Release Omega

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-publish:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tagVersion -ne $packageVersion) {
            throw "Git tag v$tagVersion does not match package.json version $packageVersion"
          }

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win nsis --publish always

      - name: Ensure NSIS blockmap is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $source = Join-Path "release" "Omega Setup $version.exe.blockmap"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "NSIS blockmap was not generated: $source"
          }
          $asset = Join-Path $env:RUNNER_TEMP "Omega-Setup-$version.exe.blockmap"
          Copy-Item -LiteralPath $source -Destination $asset -Force
          gh release upload $env:GITHUB_REF_NAME $asset --repo "JuanCardona05/Omega" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the NSIS blockmap to the release."
          }
